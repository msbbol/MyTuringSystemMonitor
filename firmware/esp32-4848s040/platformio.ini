; Wi-Fi display firmware for the Guition ESP32-4848S040 (ESP32-S3, 4" 480x480 ST7701 RGB panel).
; Build & flash:  pio run -t upload        Serial log:  pio device monitor

[env:esp32-4848s040]
platform = espressif32@6.13.0          ; Arduino core 2.0.17 — Arduino_GFX 1.4.x needs core 2.x
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; N16R8: 16 MB QIO flash + 8 MB octal PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    tzapu/WiFiManager@2.0.17

monitor_speed = 115200
upload_speed = 921600
